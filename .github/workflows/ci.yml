name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      DEMO_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_demo
      PGPASSWORD: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create extra databases
        run: |
          psql -h localhost -U ledger -d ledger -c "CREATE DATABASE ledger_test"
          psql -h localhost -U ledger -d ledger -c "CREATE DATABASE ledger_demo"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Migrations apply on an empty database
        run: alembic upgrade head
      - name: Offline demo
        run: python -m donation_ledger.demo
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
